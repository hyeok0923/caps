<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Receipt + Fit!</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        parchment: '#f5f5f7',
                        canvas: '#ffffff',
                        ink: '#1d1d1f',
                        muted: '#7a7a7a',
                        action: '#0066cc',
                        hairline: '#e0e0e0',
                        black: '#000000'
                    },
                    fontFamily: {
                        sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    },
                    fontSize: {
                        nav: ['12px', { lineHeight: '1.0', letterSpacing: '-0.12px', fontWeight: '400' }],
                        caption: ['14px', { lineHeight: '1.29', letterSpacing: '-0.224px', fontWeight: '400' }],
                        body: ['17px', { lineHeight: '1.47', letterSpacing: '-0.374px', fontWeight: '400' }],
                        strong: ['17px', { lineHeight: '1.24', letterSpacing: '-0.374px', fontWeight: '600' }],
                        tagline: ['21px', { lineHeight: '1.19', letterSpacing: '0.231px', fontWeight: '600' }],
                        display: ['34px', { lineHeight: '1.1', letterSpacing: '-0.374px', fontWeight: '600' }],
                        hero: ['40px', { lineHeight: '1.1', letterSpacing: '-0.28px', fontWeight: '600' }],
                    },
                    borderRadius: {
                        apple: '18px',
                        pill: '9999px'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .view { display: none; }
        .view.active { display: block; animation: fade 0.25s ease-out forwards; }
        @keyframes fade {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .frosted {
            background-color: rgba(245, 245, 247, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        input:focus, select:focus { outline: none; }
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="font-sans text-body select-none">

    <!-- App Container -->
    <main class="max-w-[414px] mx-auto min-h-screen bg-parchment relative pb-[100px]">
        
        <!-- DASHBOARD VIEW -->
        <div id="dashboard-view" class="view active">
            <div class="h-[52px] frosted sticky top-0 z-40 border-b border-hairline flex items-center px-6">
                <h1 class="text-tagline">レシピート</h1>
            </div>

            <div class="px-6 py-8 text-center">
                <p class="text-strong text-muted mb-2">総支出 (Total Expenses)</p>
                <h2 class="text-hero tracking-tighter" id="dash-total">₩0</h2>
            </div>

            <div class="px-6 space-y-4 mb-6">
                <div class="bg-canvas border border-hairline rounded-apple p-[24px]">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-strong">現金</span>
                        <span class="text-body text-muted">Cash</span>
                    </div>
                    <div class="text-display" id="dash-cash">₩0</div>
                </div>

                <div class="bg-canvas border border-hairline rounded-apple p-[24px]">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-strong">WOWPASS</span>
                        <span class="text-body text-muted">Prepaid</span>
                    </div>
                    <div class="text-display" id="dash-wowpass">₩0</div>
                </div>

                <div class="bg-canvas border border-hairline rounded-apple p-[24px]">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-strong">クレジットカード</span>
                        <span class="text-body text-muted">Credit Card</span>
                    </div>
                    <div class="text-display" id="dash-card">₩0</div>
                </div>
            </div>

            <!-- Categories Summary Section -->
            <div class="px-6">
                <h3 class="text-strong mb-3">カテゴリー別支出 (Categories)</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-canvas border border-hairline rounded-apple p-4">
                        <p class="text-caption text-muted">음식 (食事)</p>
                        <p class="text-strong text-lg mt-1" id="cat-food">₩0</p>
                    </div>
                    <div class="bg-canvas border border-hairline rounded-apple p-4">
                        <p class="text-caption text-muted">쇼핑 (ショッピング)</p>
                        <p class="text-strong text-lg mt-1" id="cat-shopping">₩0</p>
                    </div>
                    <div class="bg-canvas border border-hairline rounded-apple p-4">
                        <p class="text-caption text-muted">교통비 (交通)</p>
                        <p class="text-strong text-lg mt-1" id="cat-transport">₩0</p>
                    </div>
                    <div class="bg-canvas border border-hairline rounded-apple p-4">
                        <p class="text-caption text-muted">숙박 (宿泊)</p>
                        <p class="text-strong text-lg mt-1" id="cat-accommodation">₩0</p>
                    </div>
                </div>
            </div>

            <div class="fixed bottom-0 left-0 right-0 frosted border-t border-hairline py-4 px-6 flex justify-center z-40 max-w-[414px] mx-auto">
                <button onclick="navTo('scan-view')" class="bg-action text-white rounded-pill px-[22px] py-[11px] text-body active:scale-95 transition-transform duration-100 shadow-sm w-full font-medium">
                    レシート撮影 (Scan Receipt)
                </button>
            </div>
        </div>

        <!-- SCAN VIEW -->
        <div id="scan-view" class="view">
            <div class="h-[52px] frosted sticky top-0 z-40 border-b border-hairline flex items-center px-4">
                <button onclick="navTo('dashboard-view')" class="text-action text-body active:opacity-50 transition-opacity">
                    <span class="mr-1">‹</span>戻る
                </button>
                <h1 class="text-tagline mx-auto pr-8">レシート撮影</h1>
            </div>

            <div class="px-6 py-8">
                <div class="bg-canvas border border-hairline rounded-apple p-[24px] flex flex-col items-center justify-center min-h-[400px]">
                    <div class="w-full h-[300px] bg-black border border-hairline rounded-lg flex items-center justify-center relative mb-6 overflow-hidden">
                        <video id="camera-feed" class="absolute inset-0 w-full h-full object-cover z-0" autoplay playsinline></video>
                        <canvas id="camera-canvas" class="hidden"></canvas>
                        
                        <div id="camera-flash" class="absolute inset-0 bg-white opacity-0 pointer-events-none z-20 transition-opacity duration-75"></div>

                        <div id="scan-loading-overlay" class="absolute inset-0 bg-white hidden flex-col items-center justify-center z-30 transition-opacity duration-300 opacity-0">
                            <svg class="animate-spin h-8 w-8 text-black mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <p class="text-caption text-ink font-medium">レシートを分析中...</p>
                        </div>

                        <div class="absolute top-4 left-4 w-6 h-6 border-t-2 border-l-2 border-white opacity-80 z-10"></div>
                        <div class="absolute top-4 right-4 w-6 h-6 border-t-2 border-r-2 border-white opacity-80 z-10"></div>
                        <div class="absolute bottom-4 left-4 w-6 h-6 border-b-2 border-l-2 border-white opacity-80 z-10"></div>
                        <div class="absolute bottom-4 right-4 w-6 h-6 border-b-2 border-r-2 border-white opacity-80 z-10"></div>
                        
                        <div id="camera-overlay-text" class="absolute inset-0 flex items-center justify-center pointer-events-none z-10 bg-black/20">
                            <p class="text-caption text-white text-center px-8 font-medium">
                                レシート全体を写してください<br>(Scan the entire receipt)
                            </p>
                        </div>
                    </div>

                    <button onclick="simulateScan()" class="bg-action text-white rounded-pill px-[22px] py-[11px] text-body active:scale-95 transition-transform duration-100 font-medium">
                        Capture
                    </button>
                </div>
            </div>
        </div>

        <!-- PAYMENT VIEW -->
        <div id="payment-view" class="view">
            <div class="h-[52px] frosted sticky top-0 z-40 border-b border-hairline flex items-center px-4">
                <button onclick="navTo('scan-view')" class="text-action text-body active:opacity-50 transition-opacity">
                    <span class="mr-1">‹</span>戻る
                </button>
                <h1 class="text-tagline mx-auto pr-8">支払い方法</h1>
            </div>

            <div class="px-6 py-8">
                <div class="mb-8 text-center">
                    <p class="text-body text-muted mb-1" id="payment-store-name">ソウルカフェ</p>
                    <h2 class="text-display" id="payment-total-amount">₩8,000</h2>
                </div>

                <div class="bg-canvas border border-hairline rounded-apple p-0 overflow-hidden mb-8">
                    <label class="flex items-center justify-between p-[24px] border-b border-hairline active:bg-parchment transition-colors cursor-pointer">
                        <span class="text-strong">現金 (Cash)</span>
                        <div class="w-6 h-6 rounded-full border-2 border-action flex items-center justify-center relative">
                            <div class="w-3 h-3 bg-action rounded-full" id="radio-cash"></div>
                        </div>
                        <input type="radio" name="payment" value="cash" class="hidden" checked onchange="updateRadioUI('cash')">
                    </label>

                    <label class="flex items-center justify-between p-[24px] border-b border-hairline active:bg-parchment transition-colors cursor-pointer">
                        <span class="text-strong">WOWPASS</span>
                        <div class="w-6 h-6 rounded-full border-2 border-hairline flex items-center justify-center relative">
                            <div class="w-3 h-3 bg-transparent rounded-full" id="radio-wowpass"></div>
                        </div>
                        <input type="radio" name="payment" value="wowpass" class="hidden" onchange="updateRadioUI('wowpass')">
                    </label>

                    <label class="flex items-center justify-between p-[24px] active:bg-parchment transition-colors cursor-pointer">
                        <span class="text-strong">クレジットカード</span>
                        <div class="w-6 h-6 rounded-full border-2 border-hairline flex items-center justify-center relative">
                            <div class="w-3 h-3 bg-transparent rounded-full" id="radio-card"></div>
                        </div>
                        <input type="radio" name="payment" value="card" class="hidden" onchange="updateRadioUI('card')">
                    </label>
                </div>

                <button onclick="navTo('confirm-view')" class="w-full bg-action text-white rounded-pill px-[22px] py-[11px] text-body active:scale-95 transition-transform duration-100 font-medium block text-center">
                    保存 (Save)
                </button>
            </div>
        </div>

        <!-- CONFIRM VIEW -->
        <div id="confirm-view" class="view">
            <div class="h-[52px] frosted sticky top-0 z-40 border-b border-hairline flex items-center px-4">
                <button onclick="navTo('payment-view')" class="text-action text-body active:opacity-50 transition-opacity">
                    <span class="mr-1">‹</span>戻る
                </button>
                <h1 class="text-tagline mx-auto pr-8">内容を確認</h1>
            </div>

            <div class="px-6 py-8">
                <div class="bg-canvas border border-hairline rounded-apple p-[24px] mb-8">
                    <div class="flex items-center border-b border-hairline py-4 first:pt-0">
                        <div class="w-1/3 text-muted text-body">日付</div>
                        <input type="text" id="confirm-date" class="w-2/3 text-body font-medium bg-transparent border-none outline-none text-right focus:text-action transition-colors" value="2026.11.03">
                    </div>

                    <div class="flex items-center border-b border-hairline py-4">
                        <div class="w-1/3 text-muted text-body">店舗</div>
                        <input type="text" id="confirm-store" class="w-2/3 text-body font-medium bg-transparent border-none outline-none text-right focus:text-action transition-colors" value="ソウルカフェ">
                    </div>

                    <div class="flex items-center border-b border-hairline py-4">
                        <div class="w-1/3 text-muted text-body">カテゴリー</div>
                        <select id="confirm-category" class="w-2/3 text-body font-medium bg-transparent border-none outline-none text-right focus:text-action transition-colors">
                            <option value="음식">음식 (食事)</option>
                            <option value="쇼핑">쇼핑 (ショッピング)</option>
                            <option value="교통비">교통비 (交通)</option>
                            <option value="숙박">숙박 (宿泊)</option>
                        </select>
                    </div>

                    <div class="py-4 border-b border-hairline">
                        <div class="text-muted text-body mb-3">明細</div>
                        <div id="confirm-items-container" class="space-y-2"></div>
                    </div>

                    <div class="flex justify-between items-center pt-6 pb-2">
                        <div class="text-strong">合計 (₩)</div>
                        <input type="number" id="confirm-total" class="text-display bg-transparent border-none outline-none text-right focus:text-action transition-colors w-1/2" value="8000">
                    </div>
                </div>

                <button onclick="finalizeTransaction()" class="w-full bg-action text-white rounded-pill px-[22px] py-[11px] text-body active:scale-95 transition-transform duration-100 font-medium block text-center">
                    次へ (Next)
                </button>
            </div>
        </div>

    </main>

    <script>
        const mockReceipts = [
            {
                store: "ソウルカフェ",
                category: "음식",
                date: "2026.11.03",
                items: [{name: "アメリカーノ", price: 4000}, {name: "カフェラテ", price: 4000}],
                total: 8000
            },
            {
                store: "OLIVE YOUNG",
                category: "쇼핑",
                date: "2026.11.03",
                items: [{name: "マスクパック", price: 15000}, {name: "リップ", price: 12000}],
                total: 27000
            },
            {
                store: "T-money 지하철",
                category: "교통비",
                date: "2026.11.03",
                items: [{name: "공항철도 직통열차", price: 9500}],
                total: 9500
            }
        ];

        const state = {
            total: 0,
            cash: 0,
            wowpass: 0,
            card: 0,
            categories: {
                음식: 0,
                쇼핑: 0,
                교통비: 0,
                숙박: 0
            },
            pendingPaymentMethod: 'cash',
            currentReceipt: null,
            cameraStream: null
        };

        async function startCamera() {
            try {
                const video = document.getElementById('camera-feed');
                video.play().catch(e => {}); 
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                state.cameraStream = stream;
            } catch (err) {
                console.error("Camera access denied or unavailable", err);
                const overlay = document.getElementById('camera-overlay-text');
                if (overlay) {
                    overlay.innerHTML = '<p class="text-caption text-white text-center px-8">Camera unavailable<br>(Requires HTTPS & Camera Permissions)</p>';
                }
            }
        }

        function stopCamera() {
            if (state.cameraStream) {
                state.cameraStream.getTracks().forEach(track => track.stop());
                state.cameraStream = null;
                const video = document.getElementById('camera-feed');
                if (video) video.srcObject = null;
            }
        }

        function navTo(viewId) {
            if (viewId === 'scan-view') {
                startCamera();
            } else {
                stopCamera();
            }

            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function formatMoney(num) {
            return '₩' + num.toLocaleString('en-US');
        }

        function populateDynamicData() {
            const receipt = state.currentReceipt;
            if (!receipt) return;

            document.getElementById('payment-store-name').innerText = receipt.store;
            document.getElementById('payment-total-amount').innerText = formatMoney(receipt.total);

            document.getElementById('confirm-date').value = receipt.date || '';
            document.getElementById('confirm-store').value = receipt.store || '';
            document.getElementById('confirm-category').value = receipt.category || '음식';
            document.getElementById('confirm-total').value = receipt.total || 0;

            const itemsContainer = document.getElementById('confirm-items-container');
            itemsContainer.innerHTML = '';
            
            if (receipt.items && Array.isArray(receipt.items)) {
                receipt.items.forEach((item) => {
                    const row = document.createElement('div');
                    row.className = 'flex justify-between items-center text-body font-medium';
                    row.innerHTML = `
                        <input type="text" class="w-2/3 bg-transparent border-none outline-none focus:text-action" value="${item.name}">
                        <input type="number" class="w-1/3 bg-transparent border-none outline-none text-right focus:text-action" value="${item.price}">
                    `;
                    itemsContainer.appendChild(row);
                });
            }
        }

        async function simulateScan() {
            const flash = document.getElementById('camera-flash');
            flash.classList.remove('opacity-0');
            flash.classList.add('opacity-100');
            
            setTimeout(() => {
                flash.classList.remove('opacity-100');
                flash.classList.add('opacity-0');
            }, 100);

            const video = document.getElementById('camera-feed');
            const canvas = document.getElementById('camera-canvas');
            let base64ImageData = null;
            
            if (video && video.videoWidth > 0) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                base64ImageData = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                video.pause();
            }

            const loadingOverlay = document.getElementById('scan-loading-overlay');
            loadingOverlay.classList.remove('hidden');
            setTimeout(() => loadingOverlay.classList.remove('opacity-0'), 10); 

            try {
                if (!base64ImageData) throw new Error("No camera data available");

                const payload = {
                    contents: [
                        {
                            role: "user",
                            parts: [
                                { text: "Analyze this receipt and extract details. Categorize strictly into one of these four categories: '음식', '쇼핑', '교통비', '숙박'." },
                                {
                                    inlineData: {
                                        mimeType: "image/jpeg",
                                        data: base64ImageData
                                    }
                                }
                            ]
                        }
                    ],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                date: { type: "STRING" },
                                storeName: { type: "STRING" },
                                category: { type: "STRING", enum: ["음식", "쇼핑", "교통비", "숙박"] },
                                items: {
                                    type: "ARRAY",
                                    items: {
                                        type: "OBJECT",
                                        properties: {
                                            name: { type: "STRING" },
                                            price: { type: "NUMBER" }
                                        }
                                    }
                                },
                                totalAmount: { type: "NUMBER" }
                            },
                            required: ["date", "storeName", "category", "items", "totalAmount"]
                        }
                    }
                };

                const apiKey = ""; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.candidates && result.candidates[0]?.content?.parts?.[0]?.text) {
                    const parsedData = JSON.parse(result.candidates[0].content.parts[0].text);
                    state.currentReceipt = {
                        store: parsedData.storeName || "不明な店舗",
                        category: parsedData.category || "음식",
                        date: parsedData.date || "----.--.--",
                        items: parsedData.items || [],
                        total: parsedData.totalAmount || 0
                    };
                } else {
                    throw new Error("Invalid response format from Gemini");
                }

            } catch (err) {
                console.error("Gemini API Error, falling back to mock data:", err);
                const randomIdx = Math.floor(Math.random() * mockReceipts.length);
                state.currentReceipt = mockReceipts[randomIdx];
            }

            loadingOverlay.classList.add('opacity-0');
            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
                populateDynamicData();
                navTo('payment-view');
            }, 300);
        }

        function updateRadioUI(selectedMethod) {
            state.pendingPaymentMethod = selectedMethod;
            
            const methods = ['cash', 'wowpass', 'card'];
            methods.forEach(method => {
                const indicator = document.getElementById(`radio-${method}`);
                const container = indicator.parentElement;
                
                if (method === selectedMethod) {
                    indicator.classList.remove('bg-transparent');
                    indicator.classList.add('bg-action');
                    container.classList.remove('border-hairline');
                    container.classList.add('border-action');
                } else {
                    indicator.classList.add('bg-transparent');
                    indicator.classList.remove('bg-action');
                    container.classList.add('border-hairline');
                    container.classList.remove('border-action');
                }
            });
        }

        function finalizeTransaction() {
            if (!state.currentReceipt) return;

            const editedTotal = parseInt(document.getElementById('confirm-total').value, 10);
            const pendingAmount = isNaN(editedTotal) ? state.currentReceipt.total : editedTotal;
            const selectedCategory = document.getElementById('confirm-category').value;

            state.total += pendingAmount;
            state[state.pendingPaymentMethod] += pendingAmount;
            if (state.categories[selectedCategory] !== undefined) {
                state.categories[selectedCategory] += pendingAmount;
            }

            document.getElementById('dash-total').innerText = formatMoney(state.total);
            document.getElementById('dash-cash').innerText = formatMoney(state.cash);
            document.getElementById('dash-wowpass').innerText = formatMoney(state.wowpass);
            document.getElementById('dash-card').innerText = formatMoney(state.card);

            document.getElementById('cat-food').innerText = formatMoney(state.categories['음식']);
            document.getElementById('cat-shopping').innerText = formatMoney(state.categories['쇼핑']);
            document.getElementById('cat-transport').innerText = formatMoney(state.categories['교통비']);
            document.getElementById('cat-accommodation').innerText = formatMoney(state.categories['숙박']);

            navTo('dashboard-view');
            updateRadioUI('cash');
        }
    </script>
</body>
</html>
