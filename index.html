<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#574964"><meta name="description" content="韓国旅行のお金を、シンプルに記録。"><title>Receipt + Fit!</title><style>
:root{color-scheme:light;font-family:Arial,'Hiragino Sans',Meiryo,sans-serif;color:#FFDAB3;background:#574964}*{box-sizing:border-box}html,body{min-height:100%;background-color:#574964;color:#FFDAB3}body{margin:0;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #FFDAB3;outline-offset:4px}.page{width:min(100% - 48px,500px);margin:auto}header{height:100px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:800;letter-spacing:-.8px}.logo b{color:#FFDAB3}.language{border:0;border-radius:999px;background:#9F8383;color:#241d2a;font-size:11px;padding:9px 13px}main{padding:65px 0 70px}.eyebrow{color:#FFDAB3;font-size:11px;letter-spacing:2px;margin:0 0 14px}h1{font-size:28px;letter-spacing:-.7px;margin:0 0 12px} .intro{font-size:13px;color:#FFDAB3;margin:0 0 36px;line-height:1.6}.balance{padding:30px;background:#C8AAAA;border-radius:16px}.label{color:#FFDAB3;font-size:13px;margin:0}.amount{font-size:54px;font-weight:700;letter-spacing:-2px;margin:14px 0 29px;font-variant-numeric:tabular-nums}.amount small{font-weight:400;font-size:28px;letter-spacing:0;color:#FFDAB3;margin-right:7px}.remaining{border-top:1px solid #ffffff12;padding-top:22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.remaining strong{font-size:21px;font-weight:700}.actions{margin-top:24px;display:flex;flex-direction:column;gap:12px}button.primary{background:#FFDAB3;color:#574964;border:0;border-radius:999px;padding:17px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:9px}button.secondary{border:1px solid #C8AAAA;color:#FFDAB3;border-radius:999px;background:transparent;padding:16px;font-size:13px;font-weight:700}button:hover{filter:brightness(1.12)}button svg{height:18px;width:18px;stroke:currentColor;stroke-width:1.7;fill:none}.sample{color:#FFDAB3;font-size:10px;text-align:center;margin-top:24px}footer{font-size:10px;color:#C8AAAA;text-align:center;padding:0 0 32px;letter-spacing:1px}dialog{border:0;border-radius:16px;background:#574964;color:#FFDAB3;width:min(420px,calc(100% - 32px));max-height:85vh;padding:25px;box-shadow:0 8px 24px #241d2a55}dialog::backdrop{background:#241d2aaa}.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h2{font-size:21px;margin:0}.close{width:30px;height:30px;border:0;background:#9F8383;color:#241d2a;border-radius:50%;font-size:23px}.hint{font-size:12px;color:#FFDAB3;line-height:1.6}label{display:block;font-size:12px;font-weight:700;margin:17px 0 8px}input,select{border:1px solid #666;background:#9F8383;color:#241d2a;border-radius:9px;width:100%;padding:12px}input[type=file]{font-size:11px}#preview{max-height:200px;width:100%;object-fit:contain;margin-top:12px}form .primary{width:100%;margin-top:23px}#error{font-size:12px;color:#FFDAB3}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#FFDAB3;color:#574964;box-shadow:0 8px 24px #241d2a55;border-radius:9px;padding:14px 22px;font-size:12px;width:max-content;max-width:90vw} @media(max-width:575px){header{height:85px}main{padding:43px 0 55px}h1{font-size:26px}.intro{font-size:12px;margin-bottom:30px}.balance{padding:27px 24px}.amount{font-size:48px}.remaining strong{font-size:20px}}
.balance{color:#241d2a;box-shadow:0 8px 0 #9F8383}.balance .label,.amount small{color:#574964}.remaining{border-top-color:#9F8383}.language{font-weight:700;box-shadow:inset 0 0 0 1px #C8AAAA66}input,select{background:#FFDAB3;color:#574964;border-color:#C8AAAA}.hint{color:#FFDAB3}.balance .label{font-weight:600}button.secondary:hover{background:#9F8383;color:#241d2a}#toast{color:#574964}.edit-link{display:block;margin:19px auto 0;border:0;background:transparent;color:#FFDAB3;font-size:12px;text-decoration:underline;text-underline-offset:4px;padding:8px}.history-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 0;border-top:1px solid #C8AAAA55}.history-info{min-width:0}.history-info strong{display:block;font-size:14px;overflow-wrap:anywhere}.history-info p{font-size:11px;color:#FFDAB3;margin:7px 0 0}.history-edit{border:0;border-radius:999px;background:#FFDAB3;color:#574964;padding:10px 15px;font-size:12px;font-weight:700;flex-shrink:0}.history-note{font-size:11px;line-height:1.6;color:#FFDAB3}#historyList{margin-top:20px}</style></head><body style="margin:0;min-height:100vh;background-color:#574964;color:#FFDAB3;"><div class="page"><header><div class="logo">Receipt <b>+</b> Fit!</div><button class="language" id="language" aria-label="한국어로 전환">JP / KR</button></header><main><p class="eyebrow">MY TRIP · SEOUL</p><h1 data-ja="旅のお金を、ひとつに。" data-ko="여행 지출을 한곳에.">旅のお金を、ひとつに。</h1><p class="intro" data-ja="記録はかんたんに。旅は、もっと自由に。" data-ko="기록은 간편하게. 여행은 더 자유롭게.">記録はかんたんに。旅は、もっと自由に。</p><section class="balance" aria-label="Travel expenses"><p class="label" data-ja="これまでの支出" data-ko="지금까지 쓴 돈">これまでの支出</p><div class="amount"><small>₩</small><span id="total">150,000</span></div><div class="remaining"><span class="label" id="remainingLabel">残りの予算</span><strong id="remaining">₩150,000</strong></div></section><div class="actions"><button class="primary" id="photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l1-2h6l1 2h4a1 1 0 0 1 1 1v13H3V6a1 1 0 0 1 1-1z"/><circle cx="12" cy="12" r="4"/></svg><span data-ja="レシートを登録" data-ko="영수증 등록">レシートを登録</span></button><button class="secondary" id="manual" data-ja="手入力する" data-ko="직접 입력">手入力する</button></div><button class="edit-link" id="editHistory" data-ja="記録を修正する" data-ko="기록 수정">記録を修正する</button><p class="sample" data-ja="サンプル旅行 · 予算 ₩300,000" data-ko="샘플 여행 · 예산 ₩300,000">サンプル旅行 · 予算 ₩300,000</p></main><footer>Receipt + Fit! &nbsp; / &nbsp; ENJOY YOUR TRIP.</footer></div>
<dialog id="history" aria-labelledby="historyTitle"><div class="dialoghead"><h2 id="historyTitle" data-ja="記録を修正" data-ko="기록 수정">記録を修正</h2><button class="close" id="closeHistory" aria-label="Close history">×</button></div><p class="history-note" data-ja="修正する記録を選んでください。" data-ko="수정할 내역을 선택해 주세요.">修正する記録を選んでください。</p><div id="historyList"></div><p class="history-note" data-ja="初期サンプルの₩150,000は、この一覧に含まれません。" data-ko="초기 샘플 금액 150,000원은 이 목록에 포함되지 않아요.">初期サンプルの₩150,000は、この一覧に含まれません。</p></dialog><dialog id="entry" aria-labelledby="entryTitle"><div class="dialoghead"><h2 id="entryTitle" data-ja="支出を記録" data-ko="지출 기록">支出を記録</h2><button id="close" class="close" aria-label="Close">×</button></div><div id="photoArea" hidden><label for="image" data-ja="レシートの写真" data-ko="영수증 사진">レシートの写真</label><input type="file" id="image" accept="image/*" capture="environment"><img id="preview" alt="Receipt preview" hidden><p class="hint" data-ja="写真を見ながら金額を入力してください。自動読み取りは未対応です。" data-ko="사진을 보며 금액을 입력해 주세요. 자동 인식은 아직 지원하지 않아요.">写真を見ながら金額を入力してください。自動読み取りは未対応です。</p></div><form id="form"><label for="name" data-ja="店名・メモ" data-ko="상호·메모">店名・メモ</label><input id="name" required maxlength="60" autocomplete="off"><label for="amount" data-ja="金額（ウォン）" data-ko="금액 (원)">金額（ウォン）</label><input id="amount" type="number" required min="1" max="100000000" step="1" inputmode="numeric" placeholder="8000"><label for="method" data-ja="支払い方法" data-ko="결제수단">支払い方法</label><select id="method"><option value="cash" data-ja="現金" data-ko="현금">現金</option><option value="wow">WOWPASS</option><option value="card" data-ja="クレジットカード" data-ko="개인 카드">クレジットカード</option></select><p id="error" role="alert"></p><button class="primary" type="submit" data-ja="記録する" data-ko="기록하기">記録する</button></form></dialog><div id="toast" role="status" hidden></div>
<script>
const $=s=>document.querySelector(s);let lang='ja',entries=[],url,timer,editingIndex=null;const key='receiptfit-home-v1';try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))entries=saved.filter(e=>Number.isSafeInteger(e.amount)&&e.amount>0&&['cash','wow','card'].includes(e.method))}catch{}const fmt=n=>n.toLocaleString('en-US');function render(){const total=150000+entries.reduce((a,e)=>a+e.amount,0);$('#total').textContent=fmt(total);$('#remaining').textContent='₩'+fmt(Math.abs(300000-total));$('#remainingLabel').textContent=total>300000?(lang==='ja'?'予算オーバー':'예산 초과'):(lang==='ja'?'残りの予算':'남은 예산')}
$('#language').onclick=()=>{lang=lang==='ja'?'ko':'ja';document.documentElement.lang=lang;document.querySelectorAll('[data-ja]').forEach(e=>e.textContent=e.dataset[lang]);$('#language').setAttribute('aria-label',lang==='ja'?'한국어로 전환':'日本語に切り替え');render()};function openEntry(photo){editingIndex=null;$('#entryTitle').textContent=lang==='ja'?'支出を記録':'지출 기록';$('#form button[type=submit]').textContent=lang==='ja'?'記録する':'기록하기';$('#form').reset();$('#error').textContent='';$('#photoArea').hidden=!photo;$('#image').value='';$('#preview').hidden=true;if(url)URL.revokeObjectURL(url);$('#entry').showModal()}$('#manual').onclick=()=>openEntry(false);$('#photo').onclick=()=>openEntry(true);$('#close').onclick=()=>$('#entry').close();$('#image').onchange=()=>{const file=$('#image').files[0];if(!file)return;if(!file.type.startsWith('image/')){$('#error').textContent=lang==='ja'?'画像を選択してください。':'이미지를 선택해 주세요.';return}if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file);$('#preview').src=url;$('#preview').hidden=false};$('#form').onsubmit=e=>{e.preventDefault();const amount=Number($('#amount').value),name=$('#name').value.trim();if(!name||!Number.isSafeInteger(amount)||amount<1||amount>100000000)return;const record={amount,name,method:$('#method').value,date:new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())};const isEditing=editingIndex!==null;const next=isEditing?entries.map((item,index)=>index===editingIndex?{...item,amount,name,method:record.method}:item):[...entries,record];try{localStorage.setItem(key,JSON.stringify(next))}catch{$('#error').textContent=lang==='ja'?'保存できませんでした。':'저장하지 못했어요.';return}entries=next;render();$('#entry').close();$('#toast').textContent=isEditing?(lang==='ja'?'修正しました。':'수정했어요.'):(lang==='ja'?'記録しました。':'기록했어요.');$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,3000)};render();

function showHistory(){const list=$('#historyList');list.replaceChildren();if(!entries.length){const p=document.createElement('p');p.className='hint';p.textContent=lang==='ja'?'まだ追加した記録がありません。まず支出を記録してください。':'아직 추가한 내역이 없어요. 먼저 지출을 기록해 주세요.';list.append(p)}for(let i=entries.length-1;i>=0;i--){const e=entries[i],row=document.createElement('div'),info=document.createElement('div'),title=document.createElement('strong'),detail=document.createElement('p'),button=document.createElement('button');row.className='history-row';info.className='history-info';title.textContent=e.name|| (lang==='ja'?'支出':'지출');const methods=lang==='ja'?{cash:'現金',wow:'WOWPASS',card:'クレジットカード'}:{cash:'현금',wow:'WOWPASS',card:'개인 카드'};detail.textContent='₩'+fmt(e.amount)+' · '+methods[e.method];button.className='history-edit';button.textContent=lang==='ja'?'修正':'수정';button.onclick=()=>{ $('#history').close();openEntry(false);editingIndex=i;$('#entryTitle').textContent=lang==='ja'?'記録を修正':'기록 수정';$('#name').value=e.name||'';$('#amount').value=e.amount;$('#method').value=e.method;$('#form button[type=submit]').textContent=lang==='ja'?'変更を保存':'수정 저장'};info.append(title,detail);row.append(info,button);list.append(row)}$('#history').showModal()}
$('#editHistory').onclick=showHistory;$('#closeHistory').onclick=()=>$('#history').close();
</script></body></html>
